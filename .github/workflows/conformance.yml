name: contract-conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史：CHANGELOG 纪律步骤要 diff push 前后的两个 commit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --quiet "jsonschema>=4.20"
      - name: Version consistency ($id / title / enum / transitions / CHANGELOG)
        run: python tools/check_versions.py
      - name: Contract changes require a CHANGELOG entry
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -q '^contract/'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md'; then
              echo "::error::contract/ changed without a CHANGELOG.md entry"
              exit 1
            fi
          fi
      - name: Schema + fixtures (valid 14/14, invalid 14/14)
        run: python tools/contract_check.py --all
      - name: Coverage / fields (one-line JSON)
        run: |
          python tools/contract_check.py --coverage
          python tools/contract_check.py --fields
      - name: Canonical digest smoke (byte-exact)
        run: python tools/contract_check.py --digest contract/fixtures/valid/step_full.json
      - name: Golden diff — Python implementation vs Java-generated golden (35 cases)
        run: python tools/check_golden.py
